[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vae"
version = "0.1.0"
description = "Representation learning with VAEs, β-VAEs, AEs and VQ-VAEs on Fashion-MNIST"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "ipykernel",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]